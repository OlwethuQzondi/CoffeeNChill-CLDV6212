$kind: http-request
name: Get All Menu Items
method: GET
url: '{{baseUrl}}/menu'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // Test: Status code is 200 OK
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      // Test: Response is a JSON array
      pm.test("Response is a JSON array", function () {
          const body = pm.response.json();
          pm.expect(body).to.be.an("array");
      });

      // Test: Each item has required fields
      pm.test("Each menu item has partitionKey, rowKey, name, price, isAvailable", function () {
          const body = pm.response.json();
          body.forEach(function (item) {
              pm.expect(item).to.have.property("partitionKey");
              pm.expect(item).to.have.property("rowKey");
              pm.expect(item).to.have.property("name");
              pm.expect(item).to.have.property("price");
              pm.expect(item).to.have.property("isAvailable");
          });
      });

      // Test: Response time is acceptable
      pm.test("Response time is less than 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });