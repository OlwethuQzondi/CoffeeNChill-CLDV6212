# IEEE Citation:
# [1] Docker, "Overview of Docker Compose," Docker Documentation, 2024.
#     Available: https://docs.docker.com/compose/
# [2] Microsoft, "Azurite emulator for local Azure Storage development," Microsoft Learn, 2024.
#     Available: https://learn.microsoft.com/en-us/azure/storage/common/storage-use-azurite

version: '3.8'

services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: coffeenchill-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    networks:
      - coffeenchill-net

  functions:
    image: <your_dockerhub_username>/coffeenchill-functions:v2.0
    container_name: coffeenchill-app
    ports:
      - "7111:80"
    environment:
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    depends_on:
      - azurite
    networks:
      - coffeenchill-net

networks:
  coffeenchill-net:
    driver: bridge